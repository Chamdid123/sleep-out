<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sleep Outside | Checkout</title>
  <link rel="stylesheet" href="../css/style.css" />
  <script type="module" src="../js/checkout.js"></script>
</head>

<body>
  <header class="divider" id="main-header"></header>
  <main class="divider">
    <section class="checkout">
      <h2>Review &amp; Place your Order</h2>
      <form id="checkout-form" novalidate>
        <fieldset>
          <legend>Shipping</legend>
          <label for="fname">First Name</label>
          <input type="text" id="fname" name="fname" required />

          <label for="lname">Last Name</label>
          <input type="text" id="lname" name="lname" required />

          <label for="street">Street Address</label>
          <input type="text" id="street" name="street" required />

          <label for="city">City</label>
          <input type="text" id="city" name="city" required />

          <label for="state">State</label>
          <input type="text" id="state" name="state" required />

          <label for="zip">Zip</label>
          <input type="text" id="zip" name="zip" required />
        </fieldset>

        <fieldset>
          <legend>Payment</legend>
          <label for="cardNumber">Card Number</label>
          <input type="text" id="cardNumber" name="cardNumber" required />

          <label for="expiration">Expiration</label>
          <input type="text" id="expiration" name="expiration" required />

          <label for="code">Security Code</label>
          <input type="text" id="code" name="code" required />
        </fieldset>

        <aside class="order-summary">
          <h3>Order Summary</h3>
          <p>Items: <span id="num-items">0</span></p>
          <p>Subtotal: <span id="cart-subtotal">$0.00</span></p>
          <p>Shipping Estimate: <span id="shipping-estimate">$0.00</span></p>
          <p>Tax: <span id="tax-estimate">$0.00</span></p>
          <p><strong>Order Total: <span id="order-total">$0.00</span></strong></p>
        </aside>

        <button type="submit" id="checkoutSubmit">Checkout</button>
      </form>
    </section>
  </main>
  <footer id="main-footer"></footer>
</body>

</html>
